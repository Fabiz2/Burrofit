spring:
  application:
    name: Burrofit

  datasource:
    username: root
    password: root
    url: jdbc:mysql://localhost:3306/burrofit?createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-plataform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update